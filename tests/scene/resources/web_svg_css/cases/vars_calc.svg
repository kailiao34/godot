<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120"><style>:root{--c:#e91e63;--w:calc(2px*3)} .bg{fill:#223} .ring{fill:none;stroke:var(--c);stroke-width:var(--w);r:calc(10px + 20px);cx:60px;cy:60px} .dot{fill:rgb(255 200 0 / 60%);r:8px;cx:60;cy:30}</style><rect class="bg" width="120" height="120"/><circle class="ring"/><circle class="dot"/></svg>